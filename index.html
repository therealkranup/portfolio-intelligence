<!DOCTYPE html>
<html lang="da" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Intelligence</title>
  <meta name="description" content="Portfolio Intelligence — overlap analysis, scoring & rebalancing for Danish investors">

  <!-- Fonts: Instrument Serif (display), Inter (body), JetBrains Mono (numbers) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Design System (replaces old tokens.css + components.css) -->
  <link rel="stylesheet" href="css/design-system.css">

  <style>
    /* Critical inline: loading spinner for first paint */
    .app-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100dvh;
      flex-direction: column;
      gap: 16px;
      background: var(--bg, #faf9f7);
      font-family: 'Inter', system-ui, sans-serif;
    }
    [data-theme="dark"] .app-loading {
      background: var(--bg, #1a1917);
    }
    .app-loading .spinner {
      width: 36px; height: 36px;
      border: 3px solid oklch(0.72 0.16 52 / 0.15);
      border-top-color: oklch(0.72 0.16 52);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .app-loading p {
      color: oklch(0.55 0.01 50);
      font-size: 0.875rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Loading state (hidden once React mounts) -->
  <div id="app-loading" class="app-loading">
    <div class="spinner"></div>
    <p>Loading Portfolio Intelligence…</p>
  </div>

  <!-- React root -->
  <div id="root"></div>

  <!-- =============================================
       EXTERNAL LIBRARIES
       ============================================= -->

  <!-- Chart.js for sector/geo doughnut charts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <!-- PDF.js for client-side PDF rendering (import scanning) -->
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
    }
  </script>

  <!-- React 18 + Babel standalone (CDN, no build tooling) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <!-- =============================================
       APPLICATION SCRIPTS (order matters)
       ============================================= -->

  <!-- 1. i18n translations (global, no JSX) -->
  <script src="js/i18n.js"></script>

  <!-- 2. Utility functions: APP_STATE, formatCurrency, saveData, etc. (global, no JSX) -->
  <script src="js/app-utils.js"></script>

  <!-- 3. Engine functions: sync, prices, overlap, score, rebalance (global, no JSX) -->
  <script src="js/engines.js"></script>

  <!-- 4. React primitives: Icon, Sparkline, Gauge, Donut, AreaChart (JSX, transpiled) -->
  <script type="text/babel" src="js/primitives.jsx"></script>

  <!-- 5. Main React application: all screens, modals, routing (JSX, transpiled) -->
  <script type="text/babel" src="js/app-react.jsx"></script>

  <!-- 6. Bootstrap: load prefs & data, then mount React -->
  <script type="text/babel">
    // Load persisted preferences and data before mounting
    if (window.loadPreferences) window.loadPreferences();
    if (window.loadData) window.loadData();

    // Mount the React app once all Babel scripts are transpiled
    function tryMount() {
      if (window.__mountApp) {
        // Hide the loading spinner
        const loader = document.getElementById('app-loading');
        if (loader) loader.style.display = 'none';
        window.__mountApp();
      } else {
        setTimeout(tryMount, 50);
      }
    }
    tryMount();
  </script>
</body>
</html>
